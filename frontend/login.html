<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | FoodLink</title>
    <link rel="icon" type="image/png" href="icon/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/styles.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .form-floating>label {
            font-weight: 500;
            color: #6c757d;
        }

        .btn-login {
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.3);
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #2e7d32;
            z-index: 10;
        }

        .input-icon input {
            padding-left: 45px;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="d-flex align-items-center py-5">
    <main class="form-signin w-100 m-auto" style="max-width: 450px;">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <i class="fas fa-leaf fa-3x" style="color: #2e7d32;"></i>
                <h2 class="mt-3 fw-bold"
                    style="background: linear-gradient(135deg, #2e7d32, #4caf50); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                    Welcome Back</h2>
                <p class="text-muted">Sign in to continue</p>
            </div>
            <form id="loginForm">
                <div class="mb-4 input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control form-control-lg rounded-pill" id="email"
                        placeholder="name@example.com" required style="padding-left: 45px;">
                </div>
                <div class="mb-4 input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control form-control-lg rounded-pill" id="password"
                        placeholder="Password" required style="padding-left: 45px;">
                </div>
                <button class="w-100 btn btn-login text-white btn-lg" type="submit" id="submitBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign in
                </button>
                <div class="text-center mt-4">
                    <p class="mb-2">New here? <a href="register.html" class="text-decoration-none fw-semibold"
                            style="color: #2e7d32;">Create an account</a></p>
                    <a href="index.html" class="text-decoration-none text-muted small">
                        <i class="fas fa-arrow-left me-1"></i> Back to Home
                    </a>
                </div>
            </form>
        </div>
    </main>

    <div id="loginFailPopup" class="d-none"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div class="bg-white p-4 rounded-4 shadow-lg text-center"
            style="max-width: 350px; width: 90%; animation: popIn 0.3s ease-out;">
            <div class="bg-danger bg-opacity-10 rounded-circle d-inline-block p-3 mb-3">
                <i class="fas fa-exclamation-triangle fa-3x text-danger"></i>
            </div>
            <h4 class="fw-bold mb-2">Login Failed</h4>
            <p id="loginErrorMsg" class="text-muted mb-4 small">Invalid email or password.<br>Please try again.</p>
            <button class="btn btn-danger rounded-pill px-5 fw-semibold" onclick="closeLoginPopup()">Try Again</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        function closeLoginPopup() {
            document.getElementById('loginFailPopup').classList.replace('d-flex', 'd-none');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class='fas fa-spinner fa-spin me-2'></i>Authenticating...`;
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                // Save status too if available (Java backend might need to return it)
                setAuth(res.token, {
                    id: res.id,
                    email: res.email,
                    role: res.role,
                    name: res.name,
                    location: res.location,
                    status: res.status // Assume backend returns status now
                });

                if (res.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
                else if (res.role === 'HOSTEL' || res.role === 'HOTEL') window.location.href = 'hostel-dashboard.html';
                else window.location.href = 'ngo-dashboard.html';
            } catch (err) {
                btn.innerHTML = originalHTML;
                btn.disabled = false;

                const errorMsg = document.getElementById('loginErrorMsg');
                errorMsg.innerHTML = err.message || 'Invalid email or password.<br>Please try again.';

                const popup = document.getElementById('loginFailPopup');
                popup.classList.replace('d-none', 'd-flex');
            }
        });
    </script>
</body>

</html>
